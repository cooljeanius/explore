---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 9
    rebase-strategy: disabled
    cooldown:
      default-days: 7
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
